- name: Playbook for system patching automate
  hosts: localhost
  gather_facts: yes
  become: yes
  # # roles:
  # #   - Pre-Patching
  # #   - Patching
  # #   - Post-Patching
  vars:
       Patching_dir: "/home/tanisha/Ansible_Patching_Playbook"
       timestamp: "{{ ansible_date_time.iso8601_basic_short }}"
       items: 
          - apache2
          - nginx
          - mysql
          - httpd

  tasks:
      - name: Post Patch Service Revalidation 
        block:
          - name: Service Revalidation Check
            include_role:
               name: Pre-Patching
               tasks_from: Gather_Active_Services.yml
            vars:
            stage_dir: "{{ stage_dir1 }}"
            Pre_Patching: "{{ Patching_stage }}"

        rescue:
           - name: Service Revalidation Failed 
             debug:
                  msg: Service Revalidation Failed 

           - name: Fail Service Revalidation
             fail:
                  msg: Service Revalidation Failed at post-patch