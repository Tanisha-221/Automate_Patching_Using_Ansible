- name: Test for differences 
  hosts: localhost
  gather_facts: yes
  become: no
  vars:
     Patching_stage: /home/tanisha/Ansible_Patching_Playbook
     stage_dir: Pre_Patching/Pre_Patching
     stage_dir2: Post_Patching/Post_Patching
  tasks:
    - name: Get the pre-patch Active services
      shell: 
         cat "{{ Patching_stage }}/{{ stage_dir }}/running_services.txt"
      register: pre_patch_running_services

    - name: Get the post-patch Active services
      shell:
         cat "{{ Patching_stage }}/{{ stage_dir2 }}/running_services.txt"
      register: post_patch_running_services

    - name: Write pre-Patch service to a temporary file
      copy: 
          content: "{{ pre_patch_running_services.stdout }}"
          dest: "{{ Patching_stage }}/{{ stage_dir2}}/Pre_Patching_service_status.txt"

    - name: Write post-patching service to a temporary file
      copy:
           content: "{{ post_patch_running_services.stdout }}"
           dest: "{{ Patching_stage }}/{{ stage_dir2}}/Post_Patching_service_status.txt"

    - name: Compare pre-patch and post-patch services using diff
      shell: |
          diff {{ Patching_stage }}/{{ stage_dir2}}/Pre_Patching_service_status.txt {{ Patching_stage }}/{{ stage_dir2}}/Post_Patching_service_status.txt
      register: diff_output
      failed_when: diff_output.rc > 1
      changed_when: diff_output.rc == 1

    - name: Display a message if files are identical
      ansible.builtin.debug:
        msg: "The files {{ Patching_stage }}/{{ stage_dir }}/running_services.txt and {{ Patching_stage }}/{{ stage_dir2 }}/running_services.txt are identical."
      when: diff_output.rc == 0
    
    - name: Generate the report of the difference between the file 
      copy:
        content: |
              {{ diff_output.stdout }}\n{{ diff_output.stderr}}
        dest: "{{ Patching_stage | default('No differences found') }}/Report.txt"
      when: diff_output.stdout or diff_output.stderr