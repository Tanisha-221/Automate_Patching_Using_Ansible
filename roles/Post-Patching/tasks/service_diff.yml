 - name: Check for the service diff 
   vars:
      stage_dir: "{{ stage_dir2 }}"
      Pre_Patching: "{{ Patching_stage }}"

   block:
     - name: Get the pre-patch Active services
       shell: 
         cat "{{ Pre_Patching }}/{{ stage_dir }}/running_services.txt"
       register: pre_patch_running_services

     - name: Get the post-patch Active services
       shell:
         cat "{{ Pre_Patching }}/{{ stage_dir }}/running_services.txt"
       register: post_patch_running_services

     - name: Compare pre-patch and post-patch services using diff
       shell: |
            diff <(echo "{{ pre_patch_running_services.stdout }}") <(echo "{{ post_patch_running_services.stdout }}")
       register: diff_output
       failed_when: false
       changed_when: false

   rescue:
        - name: Handle failure for Service diff
          debug:
             msg: Unable to find the diff between the status of the services 