- name: Generate report for the file 
  block:
     - name: Generate the report of the difference between the file 
       copy:
          content: |
                {{ diff_output.stdout }}\n{{ diff_output.stderr}}
          dest: "{{ Patching_stage | default('No differences found') }}/{{ stage_dir2 }}/Report.txt"
       when: diff_output.stdout or diff_output.stderr
  rescue: 
      - name: Handle failure for report generation
        fail: 
           msg: Not able to generate the report 